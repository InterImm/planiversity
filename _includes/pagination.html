{%- include lang.html -%}
{%- if page.previous or page.next %}
<nav class="pager" aria-label="pagination">
  {%- if page.previous %}
  <a class="pager-prev" href="{{ page.previous.url | relative_url }}"><span class="kicker">← {{ t.previous }}</span>{{ page.previous.name | default: page.previous.title }}</a>
  {%- endif %}
  {%- if page.next %}
  <a class="pager-next" href="{{ page.next.url | relative_url }}"><span class="kicker">{{ t.next }} →</span>{{ page.next.name | default: page.next.title }}</a>
  {%- endif %}
</nav>
{%- endif %}
