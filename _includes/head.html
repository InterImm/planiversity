<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add("js");(function(m){if(m)document.documentElement.dataset.theme=m[1]})(document.cookie.match(/(?:^|; )interimm-theme=(light|dark)/))</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {%- seo -%}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/favicon/android-icon-192x192.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/favicon/apple-icon-180x180.png' | relative_url }}">
  <link rel="alternate" hreflang="zh-CN" href="{{ site.url }}/">
  <link rel="alternate" hreflang="en" href="{{ site.url }}/en/">
  <!-- Shared InterImm look (colours, fonts, header, footer), served by interimm.org. See
       https://github.com/InterImm/interimm.github.io/blob/hugo/kit/README.md -->
  <link rel="stylesheet" href="https://interimm.org/kit/interimm.css?v=20261004">
  <link rel="stylesheet" href="{{ '/assets/css/planiversity.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}">
  <script src="https://interimm.org/kit/interimm.js?v=20261004" defer></script>
  {%- if include.plotly == true %}
  <script src="{{ '/assets/js/plotly-latest.min.js' | relative_url }}"></script>
  {%- endif %}
  {%- if page.mermaid %}
  <script src="{{ '/assets/mermaid/mermaid.min.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/mermaid/mermaid.css' | relative_url }}">
  {%- endif %}
  {%- if page.math %}
  <script>window.MathJax = { tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]] } };</script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  {%- endif %}
  {%- feed_meta %}
</head>
