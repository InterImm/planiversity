{%- include lang.html -%}
<a class="skip-link" href="#main">{{ t.skip }}</a>

<!-- Header: replaced with the live interimm.org menu by the kit script; this markup is the fallback. -->
<header class="site-header" data-interimm-header data-lang="{{ lk }}" data-current="planiversity" data-no-signal data-toolkit
  data-lang-cn="{{ site.url }}/" data-lang-en="{{ site.url }}/en/">
  <div class="wrap header-inner">
    <a class="brand" href="{% if lk == 'en' %}https://interimm.org/en/{% else %}https://interimm.org/{% endif %}">
      <img class="brand-mark" src="{{ '/assets/favicon/favicon-96x96.png' | relative_url }}" alt="" width="32" height="32">
      <span class="brand-name">{{ t.center }}</span>
    </a>
  </div>
</header>

<!-- The university's own sections, under the shared header. -->
<nav class="uni-bar" aria-label="{{ t.name }}">
  <div class="wrap uni-bar-inner">
    <a class="uni-name" href="{{ t.home | relative_url }}"{% if page.url == t.home %} aria-current="page"{% endif %}>
      <svg class="icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/><path d="M22 9v6"/></svg>
      {{ t.name }}
    </a>
    <ul class="uni-links">
      <li><a href="{{ t.home | relative_url }}#departments">{{ t.nav_departments }}</a></li>
      <li><a href="{{ '/members/' | relative_url }}"{% if page.url contains '/members/' %} aria-current="page"{% endif %}>{{ t.nav_members }}</a></li>
      <li><a href="{{ '/articles/' | relative_url }}"{% if page.url contains '/articles/' %} aria-current="page"{% endif %}>{{ t.nav_seminars }}</a></li>
      <li><a href="{{ '/join/' | relative_url }}"{% if page.url == '/join/' %} aria-current="page"{% endif %}>{{ t.nav_join }}</a></li>
    </ul>
  </div>
</nav>
